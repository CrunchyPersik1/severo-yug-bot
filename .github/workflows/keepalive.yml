name: keepalive

# Render free засыпает через 15 минут простоя.
# Этот пингер каждые ~10 минут не даёт сервису уснуть.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -sS -m 60 -o /dev/null -w "HTTP %{http_code} за %{time_total}s\n" https://severo-yug-bot.onrender.com/
